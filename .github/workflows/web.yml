name: Website

# Tests the website against the desktop app's calculations, then publishes it to
# GitHub Pages when main changes. Pull requests only run the tests.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "desktop/generic_performance.py"
      - "tests/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "desktop/generic_performance.py"
      - "tests/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Desktop results are up to date
        run: |
          python -m pip install -q -r desktop/requirements.txt
          python tests/dump_python.py
          git diff --exit-code -- tests/expected || {
            echo "::error::tests/expected is out of date. Run 'python tests/dump_python.py' and commit the result."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Website matches desktop app
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
