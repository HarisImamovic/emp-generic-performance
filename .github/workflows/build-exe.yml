name: Build exe

# Builds dist\Generic-Performance.exe on a GitHub-hosted Windows machine.
# - Pushing a tag like v1.0.0 publishes the exe on the repo's Releases page.
# - "Run workflow" on the Actions tab builds it without making a release
#   (download it from the run's Artifacts section).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name Generic-Performance generic_performance.py

      - uses: actions/upload-artifact@v4
        with:
          name: Generic-Performance
          path: dist/Generic-Performance.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Generic-Performance.exe
          generate_release_notes: true
